<svg xmlns="http://www.w3.org/2000/svg" width="380" height="150" viewBox="0 0 380 150"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .15  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="rough"><feTurbulence baseFrequency=".05" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter></defs><style>
.tw{font-family:"Courier New",Courier,"Nimbus Mono PS",monospace}.se{font-family:Georgia,"Times New Roman",serif}
.red{transform-box:fill-box;transform-origin:right;animation:red .55s cubic-bezier(.6,0,.3,1) both}@keyframes red{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.stamp{transform-box:fill-box;transform-origin:center;animation:st .35s cubic-bezier(.2,1.6,.4,1) both}@keyframes st{0%{opacity:0;transform:scale(2.2) rotate(var(--r))}100%{opacity:.9;transform:scale(1) rotate(var(--r))}}
.ink{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:ink 1.6s ease-out both}@keyframes ink{to{stroke-dashoffset:0}}
.drop{animation:dr .6s cubic-bezier(.2,.9,.3,1.2) both}@keyframes dr{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.type{animation:ty .01s steps(1) both}@keyframes ty{from{opacity:0}to{opacity:1}}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.sway{transform-box:fill-box;transform-origin:top center;animation:sw 4s ease-in-out infinite}@keyframes sw{50%{transform:rotate(1.5deg)}}
</style><g class="sway"><path d="M40 24 H360 q10 0 10 10 V126 q0 10 -10 10 H40 L14 80 Z" fill="#F3EAD3" filter="url(#sh)"/><path d="M40 24 H360 q10 0 10 10 V126 q0 10 -10 10 H40 L14 80 Z" fill="#F3EAD3" filter="url(#grain)"/><circle cx="42" cy="80" r="7" fill="none" stroke="#5A5043" stroke-width="2"/><path d="M35 80 Q 10 40 2 10" fill="none" stroke="#B0281F" stroke-width="2"/><text x="66" y="56" class="tw" font-size="11" letter-spacing="2" fill="#B0281F">ITEM 03-A</text><text x="66" y="90" class="se" font-size="24" font-weight="700" fill="#2A241C">GlassPDF</text><text x="66" y="116" class="tw" font-size="12" fill="#5A5043">local PDF tools · OCR</text><text x="350" y="56" text-anchor="end" class="tw" font-size="11" fill="#5A5043">↗</text></g></svg>