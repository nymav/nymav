"266" stroke="#B0281F" stroke-width="10" stroke-linecap="round"/><text x="26" y="301" class="tw" font-size="11" fill="#5A5043">dense §1.0</text><line x1="130" y1="296" x2="330" y2="296" stroke="#5A5043" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/><line class="ink" style="--l:70;animation-delay:1.8s" x1="130" y1="296" x2="200" y2="296" stroke="#2A241C" stroke-width="10" stroke-linecap="round"/><ellipse class="ink" style="--l:340;animation-delay:2.2s" cx="230" cy="245" rx="120" ry="34" fill="none" stroke="#B0281F" stroke-width="2" filter="url(#rough)"/><g class="stamp" style="--r:-7deg;animation-delay:2.50s" filter="url(#rough)"><rect x="220" y="326" width="99" height="37" rx="5" fill="none" stroke="#B0281F" stroke-width="3.5"/><rect x="225" y="330" width="89" height="27" rx="3" fill="none" stroke="#B0281F" stroke-width="1.2"/><text x="270" y="349" text-anchor="middle" class="tw" font-size="15" font-weight="700" letter-spacing="3" fill="#B0281F">SOURCED</text></g></svg>