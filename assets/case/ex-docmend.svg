<svg xmlns="http://www.w3.org/2000/svg" width="380" height="400" viewBox="0 0 380 400"><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .15  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="rough"><feTurbulence baseFrequency=".05" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter></defs><style>
.tw{font-family:"Courier New",Courier,"Nimbus Mono PS",monospace}.se{font-family:Georgia,"Times New Roman",serif}
.red{transform-box:fill-box;transform-origin:right;animation:red .55s cubic-bezier(.6,0,.3,1) both}@keyframes red{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.stamp{transform-box:fill-box;transform-origin:center;animation:st .35s cubic-bezier(.2,1.6,.4,1) both}@keyframes st{0%{opacity:0;transform:scale(2.2) rotate(var(--r))}100%{opacity:.9;transform:scale(1) rotate(var(--r))}}
.ink{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:ink 1.6s ease-out both}@keyframes ink{to{stroke-dashoffset:0}}
.drop{animation:dr .6s cubic-bezier(.2,.9,.3,1.2) both}@keyframes dr{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.type{animation:ty .01s steps(1) both}@keyframes ty{from{opacity:0}to{opacity:1}}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.sway{transform-box:fill-box;transform-origin:top center;animation:sw 4s ease-in-out infinite}@keyframes sw{50%{transform:rotate(1.5deg)}}
</style><rect x="10" y="12" width="360" height="370" rx="3" fill="#F3EAD3" filter="url(#sh)"/><rect x="10" y="12" width="360" height="370" rx="3" fill="#F3EAD3" filter="url(#grain)"/><rect x="10" y="12" width="360" height="34" fill="#B0281F" fill-opacity=".1"/><text x="26" y="35" class="tw" font-size="13" font-weight="700" letter-spacing="3" fill="#B0281F">EXHIBIT B</text><text x="354" y="35" text-anchor="end" class="tw" font-size="11" fill="#5A5043">github ↗</text><text x="26" y="84" class="se" font-size="28" font-weight="700" fill="#2A241C">DocMend</text><text x="26" y="112" class="tw" font-size="13" font-weight="normal" fill="#5A5043">finds docs that lag the code</text><rect class="red" style="animation-delay:0.30s" x="23" y="101.3" width="224" height="13.7" fill="#1B1814"/><text x="26" y="133" class="tw" font-size="13" font-weight="normal" fill="#5A5043">each finding linked to evidence</text><rect class="red" style="animation-delay:0.60s" x="23" y="122.3" width="248" height="13.7" fill="#1B1814"/><text class="type" style="animation-delay:1.0s" x="26" y="210" font-family='"Courier New",Courier,"Nimbus Mono PS",monospace' font-size="13" fill="#5A5043" xml:space="preserve">  detect(rev_a, rev_b)</text><text class="type" style="animation-delay:1.3s" x="26" y="238" font-family='"Courier New",Courier,"Nimbus Mono PS",monospace' font-size="13" fill="#B0281F" xml:space="preserve">- "compares two files"</text><text class="type" style="animation-delay:1.6s" x="26" y="266" font-family='"Courier New",Courier,"Nimbus Mono PS",monospace' font-size="13" fill="#2A241C" xml:space="preserve">+ "compares Git revisions"</text><path class="ink" style="--l:420;animation-delay:1.8s" d="M22 302 q150 10 320 -2" fill="none" stroke="#B0281F" stroke-width="2.5" filter="url(#rough)"/><text class="type" style="animation-delay:1.9s" x="26" y="294" font-family='"Courier New",Courier,"Nimbus Mono PS",monospace' font-size="13" fill="#B0281F" xml:space="preserve">  README: "compares files"</text>